{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{=site.url}">
      <img class="logo-light" src="{=site.url('images/logo.png')}" alt="Haven Sports &amp; Family Physiotherapy" width="338" height="160">
      <img class="logo-dark" src="{=site.url('images/logo-dark.png')}" alt="Haven Sports &amp; Family Physiotherapy" width="338" height="160">
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle"><span></span></label>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{=site.url}">Home</a></li>
        <li><a href="{=site.url('about-us')}">About Haven</a></li>
        <li><a href="{=site.url('what-we-treat')}">What We Treat</a></li>
        <li><a href="{=site.url('services')}">Treatments &amp; Technology</a></li>
        <li><a href="{=site.url('fees-and-appointments')}">Fees &amp; Appointments</a></li>
        <li><a href="{=site.url('for-referrers')}">For Referrers</a></li>
        <li><a href="{=site.url('location-new-premises')}">Contact &amp; Location</a></li>
      </ul>
    </nav>
    {! The booking button sits beside the menu, not inside the navigation list. !}
    <a class="btn-book" href="https://havenphysio.cliniko.com/bookings">Book online</a>
  </div>
</header>
