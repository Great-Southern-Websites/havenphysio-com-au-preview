{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{=site.url}">
      <img class="logo-light" src="{=site.url('images/logo.png')}" alt="Haven Sports &amp; Family Physiotherapy" width="338" height="160">
      <img class="logo-dark" src="{=site.url('images/logo-dark.png')}" alt="Haven Sports &amp; Family Physiotherapy" width="338" height="160">
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle"><span></span></label>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{=site.url}">Home</a></li>
        <li><a href="{=site.url('about-us')}">People</a></li>
        <li><a href="{=site.url('services')}">Services</a></li>
        <li><a href="{=site.url('location-new-premises')}">Contact / New Premises</a></li>
        <li><a class="btn-book" href="https://havenphysio.cliniko.com/bookings">Book online</a></li>
      </ul>
    </nav>
  </div>
</header>
